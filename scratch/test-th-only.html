<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: sans-serif; }
  .scroller {
    height: 600px;
    overflow-y: auto;
  }
  .admin-header {
    height: 80px;
    background: #140c08;
    color: white;
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .toolbar {
    height: 70px;
    background: #fcfaf6;
    border-bottom: 2px solid #e8dfd3;
    position: sticky;
    top: 80px;
    z-index: 20;
  }
  /* Table without overflow-y: clip */
  .table-card {
    background: white;
    border: 1px solid #e8dfd3;
  }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
  }
  /* ONLY thead is sticky */
  thead tr th {
    position: sticky;
    top: 150px; /* 80 + 70 */
    background: #f5efe6;
    border-bottom: 2px solid #e8dfd3;
    padding: 10px;
    z-index: 10;
  }
  td {
    padding: 10px;
    border-bottom: 1px solid #eee;
  }
  .date-group th {
    background: #ede6dd;
    padding: 8px 10px;
    font-weight: bold;
    border-bottom: 1px solid #e8dfd3;
    text-align: left;
  }
</style>
</head>
<body>
  <div class="scroller" id="scroller">
    <div class="admin-header">Header 80px</div>
    <div style="height: 50px;">Page Title</div>
    <div class="toolbar">Sticky Toolbar 70px</div>
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th id="thSelect">Select</th>
            <th id="thOrder">Order #</th>
            <th>Customer</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr class="date-group"><th colspan="4" id="dg1">Date Group 1: 22 Oct 2026</th></tr>
          <tr><td>[ ]</td><td id="r1">#1001</td><td>Alice</td><td><button>View</button></td></tr>
          <tr><td>[ ]</td><td>#1002</td><td>Bob</td><td><button>View</button></td></tr>
          <tr><td>[ ]</td><td>#1003</td><td>Charlie</td><td><button>View</button></td></tr>
          <tr class="date-group"><th colspan="4" id="dg2">Date Group 2: 21 Oct 2026</th></tr>
          <tr><td>[ ]</td><td id="r4">#1004</td><td>David</td><td><button>View</button></td></tr>
          <tr><td>[ ]</td><td>#1005</td><td>Eva</td><td><button>View</button></td></tr>
          <tr><td>[ ]</td><td>#1006</td><td>Frank</td><td><button>View</button></td></tr>
        </tbody>
      </table>
    </div>
    <div style="height: 600px;">Footer</div>
  </div>
  <div id="out"></div>
  <script>
    const scroller = document.getElementById('scroller');
    scroller.scrollTop = 200;
    const thOrder = document.getElementById('thOrder').getBoundingClientRect();
    const r1 = document.getElementById('r1').getBoundingClientRect();
    const dg1 = document.getElementById('dg1').getBoundingClientRect();
    document.getElementById('out').innerText = JSON.stringify({
      scrollerScrollTop: scroller.scrollTop,
      thOrderTop: thOrder.top,
      thOrderBottom: thOrder.bottom,
      dg1Top: dg1.top,
      dg1Bottom: dg1.bottom,
      r1Top: r1.top,
      isThOrderAt150: thOrder.top === 150
    });
  </script>
</body>
</html>
